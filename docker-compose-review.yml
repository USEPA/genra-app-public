
services:
  redis:
    image: redis
      # ports:
      #   - 6379:6379 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 10
    deploy:
      restart_policy:
        condition: any
  genra_api:
    env_file:
      - genra_settings_review.env
    ports:
      - ${EXT_GENRA_API_PORT}:5000
    build:
      context: ${GENRA_API_BUILD_CONTEXT:-.}
      args:
        GENRA_ARTIFACT_REPO: ${GENRA_ARTIFACT_REPO}
    deploy:
      restart_policy:
        condition: any
