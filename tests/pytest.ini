[pytest]
markers =
    slow_api: slow because of API calls
    io: reading and/or writing to files
    compare_with_ncd: compares against API results scraped from NCD
    very_slow: so slow (many minutes) you need --very-slow flag for this to run
    ui: ui endpoints
    check_fp_type_variation: checks ui endpoint compatibility against different fp types
    check_fp_type_variation_results: checks ui against different fp types
    no_smoke: Do not include in smoke test - explain why in source comment
