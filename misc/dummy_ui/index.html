<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Index</title>
        <script>API_URL = "{{EXT_GENRA_API_URL}}"</script>
        <link rel="stylesheet" href="./jquery.json-viewer/json-viewer/jquery.json-viewer.css" />
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"
                integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" 
                crossorigin="anonymous"></script>
        <script src="./jquery.json-viewer/json-viewer/jquery.json-viewer.js"></script>
    </head>
    <body>
        <h1>Not really GenRA</h1>
        <div id="api"/>
        <p id="log"/>
        <div><a href="{{EXT_GENRA_API_URL}}apidocs/"/>Swagger</a><div>
    </body>
    <script>
        jQ = jQuery
        let urls = [
            ["viewChemNN", "api/genra/v3/viewChemNN/?dsstox_cid=DTXCID40662&k0=10&fp=chm_mrgn&sel_by=tox_txrf&summarise=tox_txrf&sumrs_by=tox_fp&s0=0.1&neg0=1&pos0=1"],
            ["viewChemNNDetails", "api/genra/v3/viewChemNNDetails/?dsstox_cid=DTXCID40662&k0=10&fp=chm_mrgn&sel_by=tox_txrf&summarise=tox_txrf&sumrs_by=tox_fp&s0=0.1&neg0=1&pos0=1"],
            ["getChemNNToxData", "api/genra/v3/getChemNNToxData/?dsstox_cid=DTXCID40662&k0=10&fp=chm_mrgn&sel_by=tox_txrf&summarise=tox_txrf&sumrs_by=tox_fp&s0=0.1&neg0=1&pos0=1"],
            ["viewChemNNSummary", "api/genra/v3/viewChemNNSummary/?dsstox_cid=DTXCID40662&k0=10&fp=chm_mrgn&sel_by=tox_txrf&summarise=tox_txrf&sumrs_by=tox_fp&s0=0.1&neg0=1&pos0=1"],
            // https://comptox.epa.gov/dashboard/genra/api/genra/v3/runGenRAPerfPred  POST
        ]
        for ([index, name_url] of urls.entries()) {
            let name = name_url[0]
            let url = name_url[1]
            setTimeout(() => {
                jQ("#log").append(`<div>Called ${name}</div>`)
                jQ.ajax({
                    url: API_URL+url, 
                    timeout: 10000,
                    success: ((name) => (data) => {
                        console.log(name)
                        jQ("#api").append(`<h3>${name}</h3>`)
                        let div = jQ("<div/>")
                        jQ("#api").append(div)
                        jQ(div).jsonViewer(data, {collapsed: true})
                    })(name),
                    // error: ((name) => (data) => {
                    //     console.log(`FAIL ${name}`)
                    // })(name)
                })
            }, 5000*index)
        }
    </script>
</html>
