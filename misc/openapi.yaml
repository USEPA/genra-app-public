openapi: 3.0.0
info:
  title: GenRA
  version: '0.4'
  description: Generalized Read Across prediction of chemical activity.
  contact:
    email: genra.support@epa.gov
    name: Grace Patlewicz
paths:
  /v3/appBuildInfo:
    get:
      summary: Reports app build info., should not be public.
      description: ''
      responses:
        '200':
          description: Typical response
          content:
            application/json:
              examples:
                Typical response:
                  value:
                    git_log:
                      - >-
                        44e9b77: 26 hours ago, Pull request #255: Support
                        non-CID chems
                      - '8016b30: 7 days ago, Support non-CID chems'
                    mongodb:
                      collections:
                        - chemical_lists
                        - toxref_guideline
                        - chms_fp
                      database: genra
                      host: ccte-mongodb-dev.epa.gov
                      port: 27017
                    python_version: >-
                      3.10.2 (main, Jan 29 2022, 02:41:17) [GCC 10.2.1 20210110]
                    recent_files:
                      - path: genra/routes/v4
                        time_modified: Wed Sep 29 08:11:24 EDT 2021
                      - path: genra/genraservice/db
                        time_modified: Wed Sep 29 08:11:24 EDT 2021
                    time_app_start: Wed Sep 29 08:11:22 EDT 2021
                    time_image_built: Wed Sep 29 08:11:06 EDT 2021
      tags:
        - Container_Data_Admin
  /v3/healthCheck:
    get:
      summary: Docker container health check
      responses:
        '200':
          description: Healthy response
          content:
            application/json:
              examples:
                Healthy response:
                  value:
                    CACHE:
                      status: CACHE healthcheck PASSED
                    DB:
                      status: DB healthcheck PASSED
                    status: HEALTHY
        '500':
          description: Unhealthy response
          content:
            application/json:
              examples:
                Unhealthy response:
                  value:
                    CACHE:
                      status: CACHE healthcheck PASSED
                    DB:
                      status: DB healthcheck FAILED
                    status: UNHEALTHY
      tags:
        - Container_Data_Admin
  /v3/searchChems:
    get:
      summary: Free text search for chemicals.
      parameters:
        - name: txt
          description: A CID, SID, CASRN, SMILES, or name.
          in: query
          required: true
          example: BPA
          schema:
            type: string
      responses:
        '200':
          description: Typical response
          content:
            application/json:
              examples:
                Typical response:
                  value:
                    hits:
                      - casrn: 80-05-7
                        chem_id: DTXCID30182
                        dsstox_cid: DTXCID30182
                        dsstox_sid: DTXSID7020182
                        name: Bisphenol A
                        smiles: CC(C)(C1=CC=C(O)C=C1)C1=CC=C(O)C=C1
                      - casrn: 79371-66-7
                        chem_id: DTXCID60300710
                        dsstox_cid: DTXCID60300710
                        dsstox_sid: DTXSID20349640
                        name: 5-Hydroxybisphenol
                        smiles: CC(C)(C1=CC=C(O)C=C1)C1=CC(O)=C(O)C=C1
      tags:
        - UI_support_v3
        - UI_support_v4
  /v4/uiSetup:
    get:
      summary: Get info for UI drop-downs etc.
      parameters:
        - $ref: '#/components/parameters/chem_id'
      responses:
        '200':
          description: Typical response
          content:
            application/json:
              examples:
                Typical response:
                  value:
                    casrn: 80-05-7
                    chem_id: DTXCID30182
                    download:
                      - data_exists: true
                        description: CSV download of the read across panel
                        name: CSV - read across panel
                        subdir: /csv
                      - data_exists: true
                        description: Excel download of the read across panel
                        name: Excel - read across panel
                        subdir: /xlsx
                    dsstox_cid: DTXCID30182
                    dsstox_sid: DTXSID7020182
                    filter_by:
                      - data_exists: true
                        description: Only chemicals with ToxRef in vivo data.
                        key: tox_txrf
                        name: In vivo data
                      - data_exists: true
                        description: All chemicals by fingerprint.
                        key: no_filter
                        name: No filter (all data, slow)
                    fp_needs_gen: []
                    help_text:
                      - helpPosition: right
                        helpText: This view provides ... <there are four of these>
                        helpTextId: GENRA Analog Identification
                        iconType: Information
                    hybrid_fp_max: 3
                    mol_weight: 228.291
                    name: Bisphenol A
                    neighbor_by:
                      - data_exists: true
                        description: >-
                          Morgan fingerprints are also known as
                          extended-connectivity fingerprint ECFP4.  These
                          circular fingerprints are calculated within the RDKit
                          python library as bit vectors with a radius of 3 and a
                          length of 2048.
                        key: chm_mrgn
                        name: 'Chem: Morgan Fgrprts'
                      - data_exists: true
                        description: >-
                          Torsion fingerprints or hashed topological torsion
                          descriptors are calculated as bit vectors using
                          python's RDKit library. Developed by Nilakantan et al
                          (1986), the topological torsion is defined as a linear
                          sequence of 4 consecutively bonded non-hydrogen atoms,
                          each described by its atomic type, the number of
                          non-hydrogen branches attached to it and its number of
                          pi electron pairs.
                        key: chm_httr
                        name: 'Chem: Torsion Fgrprts'
                    smiles: CC(C)(C1=CC=C(O)C=C1)C1=CC=C(O)C=C1
      tags:
        - UI_support_v4
  /v4/uiRadialView:
    get:
      summary: Info. for first panel, radial view.
      parameters:
        - $ref: '#/components/parameters/chem_id'
        - $ref: '#/components/parameters/fp'
        - $ref: '#/components/parameters/k0'
        - $ref: '#/components/parameters/s0'
        - $ref: '#/components/parameters/sel_by'
      responses:
        '200':
          description: Typical response
          content:
            application/json:
              examples:
                Typical response:
                  value: 
                    result:
                      - chem_id: DTXCID30182
                        details_link: https://comptox.epa.gov/dashboard/chemical/details/DTXCID30182
                        dtxcid: DTXCID30182
                        dtxsid: DTXSID7020182
                        name: Bisphenol A
                        selected: true
                        similarity_tag: c
                        value: 1.00001
                        weight: 228.291
                      - chem_id: DTXCID001771
                        details_link: https://comptox.epa.gov/dashboard/chemical/details/DTXCID001771
                        dtxcid: DTXCID001771
                        dtxsid: DTXSID8021771
                        name: 4-(2-Methylbutan-2-yl)phenol
                        selected: true
                        similarity_tag: c
                        value: 0.4838709677419355
                        weight: 164.248
      tags:
        - UI_support_v4
  /v4/uiFingerPrintHeatChart:
    get:
      summary: Tabular data for data richness for each FP type.
      parameters:
        - $ref: '#/components/parameters/chem_id'
        - $ref: '#/components/parameters/fp'
        - $ref: '#/components/parameters/k0'
        - $ref: '#/components/parameters/s0'
        - $ref: '#/components/parameters/sel_by'
      responses:
        '200':
          description: Typical response
          content:
            application/json:
              examples:
                Typical response:
                  value: 
                    columns:
                      - cellRendererFramework: GenraChemicalLink
                        cellRendererParams:
                          useField: name
                        field: name
                        filter: false
                        headerName: Chemical
                        headerTooltip: The target chemical and neighbors
                        suppressMenu: true
                        tooltipField: name
                      - cellRendererFramework: HeatColoredNumber
                        field: bio_txct
                        filter: false
                        headerName: bio_txct
                        headerTooltip: ToxCast fingerprints are a non-directional fingerprint representation of assay hit calls represented by the assay component name of the associated platform.  Hit calls are taken from Level 5 of the associated invitrodb. This fingerprint collection comprises both ToxCast and Tox21 assay outcomes.
                        suppressMenu: true
                    data:
                      - bio_txct:
                          scaled: 0.8604
                          value: 323
                        chem_id: DTXCID30182
                        chm_ct:
                          scaled: 0.5
                          value: 10
                        dtxcid: DTXCID30182
                        dtxsid: DTXSID7020182
                        name: Bisphenol A
                      - bio_txct:
                          scaled: 0.3476
                          value: 143
                        chem_id: DTXCID001771
                        chm_ct:
                          scaled: 0.5
                          value: 10
                        dtxcid: DTXCID001771
                        dtxsid: DTXSID8021771
                        name: 4-(2-Methylbutan-2-yl)phenol
      tags:
        - UI_support_v4
  /v4/uiAssayList:
