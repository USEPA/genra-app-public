  /v4/uiDownload/{ftype}:
    post:
      summary: Tabular data for predictions of data in a DB
      parameters:
        - in: path
          name: ftype
          enum:
            - csv
            - xlsx
          required: true
          default: xlsx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chem_id
                - chem_inc
                - fp
                - k0
                - neg0
                - pos0
                - rra
                - s0
                - sel_by
                - summarise
                - sumrs_by
              properties:
                chem_id:
                  $ref: '#/components/parameters/chem_id'
                chem_inc:
                  $ref: '#/components/parameters/chem_inc'
                fp:
                  $ref: '#/components/parameters/fp'
                k0:
                  $ref: '#/components/parameters/k0'
                neg0:
                  $ref: '#/components/parameters/neg0'
                pos0:
                  $ref: '#/components/parameters/pos0'
                rra:
                  $ref: '#/components/parameters/rra'
                s0:
                  $ref: '#/components/parameters/s0'
                sel_by:
                  $ref: '#/components/parameters/sel_by'
                summarise:
                  $ref: '#/components/parameters/summarise'
                sumrs_by_inc:
                  $ref: '#/components/parameters/sumrs_by'
                tox_inc:
                  $ref: '#/components/parameters/tox_inc'
      responses:
        '200':
          description: Typical response
          content:
            text/csv:
            application/vnd.openxmlformats-officeodcument.spreadsheetml.sheet:
      tags:
        - UI_support_v4        
components:
  parameters:
    chem_id:
      name: chem_id
      description: A CID, SID, CASRN, SMILES, or name
      in: query
      example: DTXCID30182
      required: true
      schema:
        type: string
    chem_inc:
      name: chem_inc
      description: List of analog selection status objects
      in: query
      example:
        - {chem_id: "DTXCID30182", isChecked: true}
        - {chem_id: "CCO", isChecked: true}
      schema:
        type: array
        items: 
          type: object
          properties:
            chem_id:
              type: string
            isChecked:
              type: boolean
    k0:
      name: k0
      description: Number of neighbors (analogs) 1-15
      in: query
      example: 10
      required: true
      schema:
        type: integer
    s0:
      name: s0
      description: Similarity threshold, 0-1
      in: query
      example: 0.1
      required: true
      schema:
        type: number
            sel_by:
    name: sel_by
      description: >-
        Chemicals are neighbors of the target only if they have this type of
        data.
      in: query
      example: tox_txrf
      required: true
      schema:
        type: string
        enum:
          - tox_txrf
          - no_filter
    fp:
      name: fp
      description: The fingerprint type used to select neighbors (analogs).
      in: query
      example: chm_mrgn
      required: true
      schema:
        type: string
        enum:
          - chm_mrgn
          - chm_htpp
          - chm_ct
          - tox_txrf
          - bio_txct
          - bio_htpp_MCF7
          - bio_htpp_U2OS
    dsstox_cid:
      deprecated: true
      description: Deprecated, used chem_id
      name: dsstox_cid
      in: query
      example: DTXCID30182
      required: false
      schema:
        type: string
    pos0:
      name: pos0
      description: Minimum number of positive effect observations required to make a prediction
      in: query
      example: 1
      required: true
      schema:
        type: integer
    neg0:
      name: neg0
      description: Minimum number of negative (no) effect observations required to make a prediction
      in: query
      example: 1
      required: true
      schema:
        type: integer
    useWidth:
      name: useWidth
      description: Whether UI should scale column width by similarity, API just reflects this value
      in: query
      example: false
      required: true
      schema:
        type: boolean
    rec_inc:
      name: rec_inc
      description: List of IDs for records to include in download
      in: query
      example:
        - "CHR: bone"
        - "DEV: heart"
      schema:
        type: array
        items: 
          type: string
servers:
  - url: https://ccte-api-genra-dev.epa.gov/api/genra
    description: DevOps dev deployment
  - url: https://ccte-api-genra-stg.epa.gov/api/genra
    description: DevOps stage deployment
  - url: https://ccte-api-genra.epa.gov/genra-api/api/genra
    description: DevOps production deployment
tags:
  - name: UI_support_v4
    description: Endpoints used by the "v4" UI.
  - name: UI_support_v3
    description: Endpoints used by the "v3" UI.
  - name: Container_Data_Admin
    description: Data / admin. endpoints.
