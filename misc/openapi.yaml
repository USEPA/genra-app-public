          application/json:
            schema:
              type: object
              required:
                - chem_id
                - chem_inc
                - fp
                - k0
                - neg0
                - pos0
                - s0
                - sel_by
                - summarise
                - sumrs_by
                - useWidth
              properties:
                chem_id:
                  $ref: '#/components/parameters/chem_id'
                chem_inc:
                  $ref: '#/components/parameters/chem_inc'
                fp:
                  $ref: '#/components/parameters/fp'
                k0:
                  $ref: '#/components/parameters/k0'
                neg0:
                  $ref: '#/components/parameters/neg0'
                pos0:
                  $ref: '#/components/parameters/pos0'
                s0:
                  $ref: '#/components/parameters/s0'
                sel_by:
                  $ref: '#/components/parameters/sel_by'
                summarise:
