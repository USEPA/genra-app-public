
volumes:
  genra_standalone_db:
    external: true

services:

  genra_api:
    image: genra_app
    env_file: [".env"]
    ports:
      - ${EXT_GENRA_API_PORT}:5000

  genra_ui:
    image: genra_ui

  genra_mongo:
    image: mongo:6
    volumes:
      - genra_standalone_db:/data/db

  apache:
    image: httpd
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
    ports:
      - ${EXT_GENRA_UI_PORT}:80

  redis:
    image: redis
